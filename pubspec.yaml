name: ai_avatar_chat
description: "AI Avatar Chat - Voice-powered conversational AI with animated avatar"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Voice
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0

  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Avatar animations
  lottie: ^3.0.0

  # Permissions
  permission_handler: ^11.3.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Storage & Files
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # UI Components
  flutter_slidable: ^3.1.0

  # FFI (for mobile on-device LLM)
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - .env
